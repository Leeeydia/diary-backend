server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/diary
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ZGlhcnktYXBwLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbg==
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  max-tokens: 120

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.diary.backend.vo
  configuration:
    map-underscore-to-camel-case: true